<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="logoTitle logoDescription">
  <title id="logoTitle">PracticumFlow logo</title>
  <desc id="logoDescription">A blue glass hourglass and clock mark for PracticumFlow.</desc>
  <defs>
    <linearGradient id="glass" x1="12" y1="8" x2="84" y2="88" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6ee7ff"/>
      <stop offset=".48" stop-color="#318dff"/>
      <stop offset="1" stop-color="#1641a5"/>
    </linearGradient>
    <linearGradient id="core" x1="26" y1="22" x2="72" y2="78" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e8fbff" stop-opacity=".9"/>
      <stop offset=".5" stop-color="#69dfff" stop-opacity=".62"/>
      <stop offset="1" stop-color="#8f7dff" stop-opacity=".8"/>
    </linearGradient>
    <filter id="glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="5" y="5" width="86" height="86" rx="25" fill="#031a42" fill-opacity=".86" stroke="#71e7ff" stroke-opacity=".72" stroke-width="2"/>
  <rect x="10" y="10" width="76" height="76" rx="21" fill="url(#glass)" fill-opacity=".22" stroke="#ffffff" stroke-opacity=".24"/>
  <path d="M27 25h42M27 71h42" stroke="#e6fbff" stroke-opacity=".86" stroke-width="5" stroke-linecap="round"/>
  <path d="M31 28c0 10 8 13 17 20-9 7-17 10-17 20M65 28c0 10-8 13-17 20 9 7 17 10 17 20" fill="none" stroke="url(#core)" stroke-width="5" stroke-linecap="round"/>
  <path d="M38 36c4 4 7 7 13 11 6-4 9-7 13-11v9c-4 4-8 7-13 10-5-3-9-6-13-10Z" fill="#d9faff" fill-opacity=".78" filter="url(#glow)"/>
  <path d="M39 62c4-4 8-7 12-9 4 2 8 5 12 9-2 5-7 8-12 8s-10-3-12-8Z" fill="#70dfff" fill-opacity=".9" filter="url(#glow)"/>
  <circle cx="74" cy="24" r="5" fill="#d9faff" fill-opacity=".8"/>
</svg>
