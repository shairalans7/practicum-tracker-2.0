<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>PracticumFlow | Sign in</title>
  <style>
    :root { color-scheme: light; font-family: Inter, Segoe UI, Arial, sans-serif; color: #082c4d; background: #eaf6ff; --page: #eaf6ff; --text: #082c4d; --muted: #55708b; --surface: #ffffff4d; --border: #ffffffa8; --accent: #0878d1; --accent-soft: #d7efff; --shadow: #163a5a32; --photo-tint: #e5f6ff26; --glow-blue: #378dff4f; --glow-cyan: #42dcff55; --background-image: url("assets/lightmode.jpg"); }
    :root[data-theme="dark"] { color-scheme: dark; --page: #03122c; --text: #eaf7ff; --muted: #a8c5de; --surface: #ffffff12; --accent: #54bfff; --accent-soft: #124b87; --border: #ffffff28; --shadow: #00000080; --photo-tint: #020a1f99; --glow-blue: #1984ff55; --glow-cyan: #2bd7ff52; --background-image: url("assets/darkmode.jpg"); }
    * { box-sizing: border-box; }
    body { position: relative; isolation: isolate; min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; color: var(--text); background: var(--page); transition: background .25s, color .25s; }
    body::before { position: fixed; z-index: -2; inset: 0; content: ""; background: linear-gradient(var(--photo-tint), var(--photo-tint)), var(--background-image) center / cover no-repeat; filter: saturate(1.08) contrast(1.02); }
    body::after { position: fixed; z-index: -1; inset: 0; content: ""; pointer-events: none; background: radial-gradient(circle at 14% 17%, var(--glow-blue), transparent 34%), radial-gradient(circle at 84% 21%, var(--glow-cyan), transparent 30%); mix-blend-mode: screen; opacity: .8; }
    .card { position: relative; z-index: 1; width: min(100%, 430px); padding: 34px; border: 1px solid var(--border); border-radius: 24px; background: var(--surface); box-shadow: 0 20px 60px var(--shadow), inset 0 1px #ffffff44; backdrop-filter: blur(26px) saturate(150%); }
    .login-logo { display: block; width: 72px; height: 72px; margin: 0 0 18px; filter: drop-shadow(0 10px 18px #03122c55); }
    h1 { margin: 0; color: var(--text); font-size: 28px; }
    .subtitle { margin: 6px 0 26px; color: var(--muted); }
    label { display: block; margin: 16px 0 7px; color: var(--text); font-size: 13px; font-weight: 700; }
    input { width: 100%; padding: 13px 14px; border: 1px solid var(--border); border-radius: 11px; color: var(--text); background: #ffffff22; font: inherit; }
    input:focus { outline: 3px solid #bce7d255; border-color: #67aa88; }
    button { width: 100%; margin-top: 20px; padding: 13px 16px; border: 1px solid #ffffff45; border-radius: 11px; background: #0878d1b8; color: #fff; font-weight: 700; cursor: pointer; box-shadow: 0 10px 24px var(--shadow), inset 0 1px #ffffff42; backdrop-filter: blur(18px) saturate(145%); }
    :root[data-theme="dark"] button:not(.secondary):not(.link) { color: #102031; }
    button:disabled { cursor: not-allowed; opacity: .55; }
    .secondary { margin-top: 12px; background: transparent; color: var(--text); border: 1px solid var(--border); }
    .link { margin-top: 16px; padding: 0; background: transparent; color: var(--text); font-size: 13px; }
    .message { min-height: 20px; margin-top: 16px; padding: 10px; border-radius: 10px; font-size: 13px; }
    .message.hidden { visibility: hidden; }
    .message.error { background: #8d3c3c44; color: #a63d3d; }
    :root[data-theme="dark"] .message.error { color: #ffbaba; }
    .message.success { background: #b9e7dc44; color: #25734c; }
    :root[data-theme="dark"] .message.success { color: #b8ead1; }
    .auth-status { display: flex; align-items: center; gap: 8px; min-height: 22px; margin: 14px 0 0; color: var(--muted); font-size: 13px; }
    .auth-status[hidden] { display: none; }
    .spinner { width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .theme-toggle { position: absolute; top: 18px; right: 18px; width: 42px; height: 42px; margin: 0; padding: 0; border: 1px solid var(--border); border-radius: 50%; background: #ffffff22 !important; color: var(--text) !important; font-size: 20px; }
    button:focus-visible, input:focus-visible { outline: 3px solid #75bca0; outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; } }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="card">
    <button id="themeToggle" class="theme-toggle" type="button" aria-label="Switch to dark mode">☾</button>
    <img class="login-logo" src="assets/practicumflow-logo.svg" alt="PracticumFlow logo">
    <h1>PracticumFlow</h1>
    <p class="subtitle">Track your practicum hours and activities.</p>
    <form id="authForm">
      <div id="nameField" hidden>
        <label for="name">Full name</label>
        <input id="name" type="text" autocomplete="name" placeholder="Your full name">
      </div>
      <label for="email">Email address</label>
      <input id="email" type="email" autocomplete="email" required placeholder="student@example.com">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required minlength="6" placeholder="At least 6 characters">
      <button id="submitButton" type="submit">Sign in</button>
    </form>
    <button id="forgotButton" class="link" type="button">Forgot password?</button>
    <button id="modeButton" class="secondary" type="button">Create a new account</button>
    <div id="authStatus" class="auth-status" hidden aria-live="polite"><span class="spinner" aria-hidden="true"></span><span id="authStatusText">Working securely</span></div>
    <div id="message" class="message hidden" role="status" aria-live="polite"></div>
    <button id="resendButton" class="link" type="button" hidden>Resend verification email</button>
  </main>
  <script src="assets/theme.js?v=competencies-layout-2"></script>
  <script type="module" src="assets/login.js?v=competencies-layout-2"></script>
</body>
</html>
